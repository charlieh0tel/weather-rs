name: Build Debian Package

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  # Runs on every push, passing trivially except on tags, because a job
  # that needs a skipped job is skipped too.
  check-version:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        if: startsWith(github.ref, 'refs/tags/v')
      - name: Check that the tag matches the version in Cargo.toml
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[0].version')"
          if [[ "${TAG}" != "v${version}" ]]; then
            echo "::error::Tag ${TAG} does not match version ${version} in Cargo.toml."
            exit 1
          fi

  build-deb:
    needs: check-version
    uses: charlieh0tel/deb-workflows/.github/workflows/rust-build-deb.yml@v1
    # Scoped to this job.  At workflow level it would also be granted to
    # the dispatch job below, which authenticates with its own PAT and
    # writes nothing here.
    permissions:
      contents: write
    with:
      build-deps: "llvm-dev libclang-dev libasound2-dev libespeak-ng-dev"

  trigger-apt-repo:
    needs: build-deb
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    steps:
      # workflow_dispatch, not repository_dispatch: the token then needs
      # Actions: write on apt-repo instead of Contents: write, which could
      # push a commit to the workflow that runs with the GPG signing key.
      - name: Trigger APT repo rebuild
        env:
          GH_TOKEN: ${{ secrets.APT_REPO_TOKEN }}
        run: gh workflow run update-repo.yml -R charlieh0tel/apt-repo
