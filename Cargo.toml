[package]
name = "weather"
version = "0.9.9"
# The name weather on crates.io belongs to a different project, so this cannot publish under it.
publish = false
edition = "2024"
license = "BSD-3-Clause"
description = "Aviation weather (METAR) reports with text-to-speech"

[dependencies]
clap = { version = "4.4", features = ["derive"] }
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "rustls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
espeakng-sys = "0.3"
base64 = "0.23"
rodio = "0.22"
hound = "3.5"
tempfile = "3.8"

[package.metadata.deb]
maintainer = "Christopher Hoover <ch@murgatroid.com>"
copyright = "2025, Christopher Hoover <ch@murgatroid.com>"
license-file = ["LICENSE", "4"]
extended-description = """\
metar fetches and decodes current METARs from aviationweather.gov.
speak-weather reads them aloud with eSpeak NG or Google Cloud
Text-to-Speech, or writes audio files for Asterisk and AllStar nodes.
nws-lookup finds the National Weather Service forecast office, grid,
zones and observation stations for a station, coordinates or address."""
# HTTPS verifies against the system's certificate store.
depends = "$auto, ca-certificates, sox"
section = "utils"
priority = "optional"
assets = [
    ["target/release/metar", "usr/bin/", "755"],
    ["target/release/speak-weather", "usr/bin/", "755"],
    ["target/release/nws-lookup", "usr/bin/", "755"],
    ["target/release/allstar-weather", "usr/bin/", "755"],
    ["README.md", "usr/share/doc/weather/", "644"],
]
